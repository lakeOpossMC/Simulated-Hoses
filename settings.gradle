pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Named after the repository (github.com/lakeOpossMC/Simulated-Hoses), so the
// Gradle project no longer takes the name of whatever folder it was unzipped into.
rootProject.name = 'Simulated-Hoses'
